<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#972c38" />
    <title>HootRoute — Logo</title>
    <style>
      :root { color-scheme: light; font-family: "Avenir Next", Avenir, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #292623; background: #fffefa; }
      * { box-sizing: border-box; }
      body { min-width: 320px; margin: 0; }
      main { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 64px 0; }
      a { color: #972c38; }
      .eyebrow { margin: 0 0 12px; color: #972c38; font-size: 11px; font-weight: 800; letter-spacing: .14em; }
      h1 { margin: 0; font-size: clamp(36px, 6vw, 58px); letter-spacing: -.06em; }
      .intro { max-width: 620px; margin: 14px 0 32px; color: #716a63; font-size: 16px; line-height: 1.6; }
      .concepts { max-width: 500px; }
      article { min-width: 0; padding: 30px; border: 1px solid #ece8e4; border-radius: 20px; background: #fff; box-shadow: 0 10px 30px rgba(52, 38, 26, .05); }
      .preview { min-height: 260px; display: grid; place-items: center; margin-bottom: 22px; border-radius: 15px; background: #fffefa; }
      .preview img { width: 150px; height: 150px; }
      .wordmark { display: flex; align-items: center; gap: 12px; padding: 13px; border: 1px solid #f0ece8; border-radius: 14px; }
      .wordmark img { width: 44px; height: 44px; padding: 6px; border-radius: 13px; background: #f8eded; }
      .wordmark strong { font-size: 20px; letter-spacing: -.04em; }
      .wordmark small { display: block; margin-top: 3px; color: #79736e; font-size: 11px; }
      .concept-number { margin: 22px 0 7px; color: #972c38; font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      h2 { margin: 0; font-size: 21px; letter-spacing: -.04em; }
      article p:last-child { min-height: 48px; margin: 9px 0 0; color: #716a63; font-size: 13px; line-height: 1.55; }
      .back { display: inline-block; margin-top: 30px; font-size: 14px; font-weight: 700; text-decoration: none; }
      @media (max-width: 760px) { main { padding: 38px 0; } .preview { min-height: 190px; } article p:last-child { min-height: 0; } }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">TEMPLE CAMPUS GUIDE</p>
      <h1>HootRoute</h1>
      <p class="intro">The selected mark: a simple owl-shaped map pin for finding places around campus.</p>
      <section class="concepts" aria-label="HootRoute logo">
        <article>
          <div class="preview"><img src="assets/hoot-route-logo-1.svg" alt="Owl face inside a map pin, with a route drawn through it" /></div>
          <div class="wordmark"><img src="assets/hoot-route-logo-1.svg" alt="" /><div><strong>HootRoute</strong><small>Temple campus guide</small></div></div>
          <p class="concept-number">Selected logo</p>
          <h2>The Owl Pin</h2>
          <p>An owl-shaped face inside a cherry-red map pin.</p>
        </article>
      </section>
      <a class="back" href="index.html">← Back to HootRoute</a>
    </main>
  </body>
</html>
